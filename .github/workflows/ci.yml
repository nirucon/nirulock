name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev pkg-config
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: sh tests/installer.sh
      # The lock must refuse a wrong password, refuse Escape, and accept the
      # right one. That is the whole security contract, so it is tested in a
      # real X server against real PAM.
      - name: Lock behaviour in a real X session
        run: |
          sudo apt-get install -y xvfb x11-utils x11-apps x11-xserver-utils x11-xkb-utils xkb-data xdotool fonts-dejavu-core procps libpam-modules passwd util-linux libxkbcommon0 libxkbcommon-x11-0 libxcb1
          cargo build --release --locked
          sudo install -m 644 pam/debian/nirulock /etc/pam.d/nirulock
          sudo useradd -m -s /bin/sh tester || true
          echo 'tester:secret123' | sudo chpasswd
          sudo install -d -o tester -g tester /home/tester/bin /home/tester/.config/niruui
          sudo install -o tester -g tester -m 755 target/release/nirulock /home/tester/bin/nirulock
          cat > /tmp/lock-test.sh <<'INNER'
          cd /home/tester
          export HOME=/home/tester DISPLAY=:90
          Xvfb :90 -screen 0 800x600x24 -nolisten tcp &
          sleep 1.5
          ./bin/nirulock > lock.log 2>&1 &
          L=$!
          sleep 2.5
          kill -0 $L 2>/dev/null || { echo "FAIL lock exited"; cat lock.log; exit 1; }
          xdotool type --delay 20 "wrongpass"; xdotool key Return; sleep 2.5
          kill -0 $L 2>/dev/null && echo "OK   wrong password keeps it locked" || { echo "FAIL unlocked on wrong password"; exit 1; }
          xdotool key Escape; sleep 0.5
          kill -0 $L 2>/dev/null && echo "OK   escape keeps it locked" || { echo "FAIL unlocked on escape"; exit 1; }
          xdotool type --delay 20 "secret123"; xdotool key Return; sleep 2.5
          kill -0 $L 2>/dev/null && { echo "FAIL correct password did not unlock"; cat lock.log; exit 1; } || echo "OK   correct password unlocks"
          INNER
          sudo -u tester sh /tmp/lock-test.sh
      # K1/K2: dead keys, compose and keypad digits with real key events on
      # the Swedish layout, against the nirulock PAM service and a test
      # account whose password needs them.
      - name: Dead keys, compose and keypad digits unlock through PAM
        run: |
          sudo useradd -M -s /bin/sh composer
          printf 'composer:Aé´^~¨12\n' | sudo chpasswd
          install -d -m 755 /tmp/nirulock-compose
          install -m 755 target/release/nirulock tests/compose-unlock.sh /tmp/nirulock-compose/
          sudo -u composer env LANG=C.UTF-8 sh /tmp/nirulock-compose/compose-unlock.sh /tmp/nirulock-compose/nirulock :91
          sudo -u composer env LANG=en_US.UTF-8 sh /tmp/nirulock-compose/compose-unlock.sh /tmp/nirulock-compose/nirulock :91
      - name: CAVA stops repainting in silence
        run: sh tests/resource-check.sh target/release/nirulock
      # [pause_music] only for the configured lock reasons (manual by
      # default), with a fake sidplayfp and no sound server.
      - name: Pause music only for a manual lock
        run: sh tests/pause-music-reason.sh target/release/nirulock :180
      # The typing click follows the password entry, through a fake
      # NIRUNOTIFY socket; nothing is played.
      - name: Typing click for keys that change the entry
        run: sh tests/typing-sound.sh target/release/nirulock :182
      # K4: no account, no lock; never a fallback to $USER or root.
      - name: A process without an account refuses to lock
        run: |
          Xvfb :89 -screen 0 800x600x24 -nolisten tcp -noreset & x=$!
          sleep 1
          if sudo env -i DISPLAY=:89 USER=root setpriv --reuid 54321 --regid 54321 --clear-groups target/release/nirulock 2> refuse.log; then
            echo "FAIL: locked without an account"; exit 1
          fi
          grep -q 'refusing to lock' refuse.log
          kill $x
      - name: Legacy timeout and input isolation regression
        run: xvfb-run -a -s '-screen 0 1280x1024x24 -noreset' cargo test --locked --test x11 -- --ignored --test-threads=1
      - name: Shellcheck
        run: |
          docker run --rm -v "$PWD":/src:ro koalaman/shellcheck:stable \
            -S warning -s sh -e SC1007 /src/install.sh /src/tests/installer.sh

  # Locked builds on the declared rust-version and on Debian 13's rustc.
  msrv:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.75", "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev pkg-config
      - run: cargo build --locked --all-targets

  pam-distros:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: archlinux:base
          - distro: debian
            image: debian:bookworm-slim
          - distro: void
            image: voidlinux/voidlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev pkg-config
      - run: cargo build --release --locked --bin pamcheck --bin nirulock
      - run: docker run --rm -e NIRU_PAM_TEST_CONTAINER=1 -v "$PWD":/src:ro '${{ matrix.image }}' sh /src/tests/pam-distro.sh '${{ matrix.distro }}'
